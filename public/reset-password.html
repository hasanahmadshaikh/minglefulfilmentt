<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Mingle Fulfilment</title>
    <link rel="icon" type="image/png" href="./img/WhatsApp Image 2025-10-18 at 03.34.27_60aa88be.jpg">
    <link rel="stylesheet" href="./css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <app-header></app-header>

    <br />
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Reset Your Password</h1>
            <p class="login-subtitle">Please enter your new password below</p>
        </div>

        <div class="form-card">
            <div id="reset-form" class="form-section active">
                <div class="form-header">
                    <h2 class="form-title">Choose New Password</h2>
                    <p class="form-description">Ensure your new password is secure and easy to remember</p>
                </div>

                <form onsubmit="handleReset(event)">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required minlength="8">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="confirmNewPassword" class="form-input" placeholder="••••••••" required minlength="8">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="resetBtn">Update Password</button>
                    <a href="/login" class="back-link" style="display: block; text-align: center; margin-top: 16px; text-decoration: none; color: #64748b; font-size: 14px;">← Back to Login</a>
                </form>
            </div>
        </div>
    </div>
    <br />

    <!-- Footer -->
    <app-footer></app-footer>

    <script src="./js/components.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            window.showToast('Invalid or missing reset token', 'error');
            setTimeout(() => window.location.href = '/login', 3000);
        }

        async function handleReset(event) {
            event.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (password !== confirmPassword) {
                window.showToast('Passwords do not match', 'error');
                return;
            }

            const btn = document.getElementById('resetBtn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span class="btn-loader"></span> Updating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.showToast(data.message, 'success');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    window.showToast(data.message || 'Reset failed', 'error');
                }
            } catch (error) {
                window.showToast('Error connecting to server', 'error');
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
